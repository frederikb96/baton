[project]
name = "baton-server"
version = "0.1.9"
description = "Self-hosted remote for Spotify: watch API, web page and Spotify login in one small container."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261103",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baton", "baton.providers"]

[tool.setuptools.package-data]
baton = ["default_config.yaml", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["baton", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
