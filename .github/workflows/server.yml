name: Server

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Type check
        run: mypy

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t baton:ci server

      - name: Start with a read-only root filesystem
        run: |
          docker run -d --name baton --read-only --tmpfs /tmp -p 8080:8080 \
            -e BATON_PUBLIC_URL=https://baton.example.com \
            -e BATON_UI_KEY=ci-ui-key-0123456789abcdefghij \
            -e BATON_SPOTIFY_CLIENT_ID=ci -e BATON_SPOTIFY_CLIENT_SECRET=ci \
            baton:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs baton
          exit 1

  gate:
    needs: [checks, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
